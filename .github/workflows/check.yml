name: Validate extension source
on:
  push:
  pull_request:
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: JavaScript syntax
        run: |
          node --check background.js
          node --check content/exporter-main.js
      - name: Prompt smoke test
        run: node scripts/test-initial-prompt.js
      - name: Manifest compatibility
        run: node scripts/test-compatibility.js
      - name: Manifest validity
        run: python3 -m json.tool manifest.json >/dev/null
      - name: Package extension
        run: bash scripts/package.sh
